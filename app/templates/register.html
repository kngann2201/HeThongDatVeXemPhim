{% extends 'layout/base.html' %}

{% block title %}Đăng ký - CINEMA{% endblock %}

{% block content %}
<div class="register-wrapper">
    <div class="register-box">
        <h2 class="register-title">ĐĂNG KÝ</h2>
        <form class="register-form" method="POST" enctype="multipart/form-data">
            <div class="input-field">
                <input class="form-control" type="text" placeholder="Họ và tên" name="full_name"
                       value="{{ data.get('full_name', '') }}" required/>
            </div>
            <div class="input-field">
                <label for="birthday" class="input-label">Ngày sinh</label>
                <input class="form-control" type="date" name="birthday" id="birthday" max="2011-12-31"
                       value="{{ data.get('birthday', '') }}" required>
                <small id="birthday-error" class="error-text"></small>
            </div>
            <div class="input-field">
                <input class="form-control" type="text" name="phone" id="phone" maxlength="10"
                       placeholder="Số điện thoại"
                       value="{{ data.get('phone', '') }}" required>
                <small id="phone-error" class="error-text"></small>
            </div>

            <div class="input-field">
                <input class="form-control" type="email" name="email" id="email" placeholder="Email"
                       value="{{ data.get('email', '') }}">
                <small id="email-error" class="error-text"></small>
            </div>

            <div class="input-field">
                <input class="form-control" type="text" name="username" id="username" placeholder="Tên đăng nhập"
                       value="{{ data.get('username', '') }}" required>
                <small id="username-error" class="error-text"></small>
            </div>

            <div class="input-field password-group">
                <input class="form-control" type="password" name="password" id="password" placeholder="Mật khẩu"
                       value="{{ data.get('password', '') }}" required>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>

            <div class="input-field password-group">
                <input class="form-control" type="password" name="confirm_password" id="confirm_password"
                       value="{{ data.get('confirm_password', '') }}" placeholder="Xác nhận mật khẩu" required>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('confirm_password', this)"></i>
                <small id="confirm-error" class="error-text"></small>
            </div>
            <div class="password-requirements">
                <p class="req-title">Yêu cầu mật khẩu:</p>
                <ul id="password-rules" class="rule-list">
                    <li id="rule-length">• Ít nhất 8 ký tự</li>
                    <li id="rule-upper">• Có chữ hoa (A-Z)</li>
                    <li id="rule-lower">• Có chữ thường (a-z)</li>
                    <li id="rule-special">• Có kí tự đặc biệt</li>
                    <li id="rule-number">• Có số (0-9)</li>
                </ul>
            </div>
            <small id="password-error" class="error-text"></small>
            <div class="input-field">
                <label for="avatar" class="input-label">Ảnh đại diện</label>
                <input class="form-control" type="file" name="avatar" id="avatar" accept="image/*">
            </div>
            <button class="btn-submit" type="submit" id="submit-btn">Đăng ký</button>
        </form>
    </div>
</div>

<style>
    .register-wrapper {
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        background-color: #f8f9fa;
        min-height: 90vh;
    }

    .register-box {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 450px;
    }

    .register-title {
        text-align: center;
        font-weight: bold;
        margin-bottom: 25px;
        color: #333;
    }

    .input-field {
        margin-bottom: 15px;
        text-align: left;
    }

    .form-control {
        width: 100% !important;
        padding: 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        display: block;
    }

    .error-text {
        color: #dc3545;
        font-size: 12px;
        display: block;
        margin-top: 4px;
    }

    .password-requirements {
        margin-top: 10px;
        padding: 15px;
        background-color: #f1f8ff; /* Màu xanh nhạt giống ảnh 2 */
        border-radius: 4px;
    }

    .req-title {
        font-weight: bold;
        font-size: 13px;
        color: #00aeef; /* Màu xanh cyan giống ảnh */
        margin-bottom: 5px;
    }

    .rule-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 13px;
    }

    .rule-list li {
        color: #6c757d;
        margin-bottom: 2px;
    }

    .text-success { color: #28a745 !important; font-weight: bold; }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #448aff; /* Màu xanh giống ảnh 2 */
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-submit:disabled {
        background-color: #a0c4ff;
        cursor: not-allowed;
    }
</style>
<script>
    const btn = document.getElementById('submit-btn');
    btn.addEventListener('click', () => {
        let flashMessage = document.querySelector('.alert');
        if (flashMessage) {
            flashMessage.remove();
        }
    });
</script>
{% endblock %}
