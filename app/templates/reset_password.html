{% extends 'layout/base.html' %}

{% block title %}Đặt lại mật khẩu{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-5">
                    <h2 class="text-center fw-bold mb-4" style="letter-spacing: -1px;">Mật khẩu mới</h2>
                    
                    <p class="text-center text-muted small mb-4">
                        Vui lòng nhập mật khẩu mới để hoàn tất việc khôi phục tài khoản.
                    </p>
                    <form method="POST">
                        <div class="mb-3">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white border-end-0 text-muted small fw-bold" style="min-width: 100px; font-size: 0.8rem;">Mật khẩu</span>
                                <input type="password" name="password" 
                                       class="form-control border-start-0 ps-0 shadow-none" 
                                       placeholder="••••••••" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white border-end-0 text-muted small fw-bold" style="min-width: 100px; font-size: 0.8rem;">Xác nhận</span>
                                <input type="password" name="confirm" 
                                       class="form-control border-start-0 ps-0 shadow-none" 
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-black w-100 py-3 fw-bold shadow-sm">
                            ĐỔI MẬT KHẨU
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="/login" class="text-decoration-none text-muted small">Hủy bỏ và quay lại</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Nút đen đồng bộ */
    .btn-black {
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        transition: all 0.3s ease;
        letter-spacing: 1px;
    }

    .btn-black:hover {
        background-color: #333333;
        color: #ffffff;
        transform: translateY(-1px);
    }

    /* Hiệu ứng focus */
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
        border-color: #000000;
    }

    .input-group-text {
        border-radius: 8px 0 0 8px !important;
        justify-content: center;
    }
    
    .form-control {
        border-radius: 0 8px 8px 0 !important;
    }
</style>
{% endblock %}
