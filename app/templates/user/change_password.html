{% extends 'layout/base.html' %}

{% block title %}Đặt lại mật khẩu{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-5">
                    <h2 class="text-center fw-bold mb-4" style="letter-spacing: -1px;">Mật khẩu mới</h2>
                    <form method="POST">
                        <div class="mb-3">
                            <div class="input-group input-group-lg password-group">
                                <span class="input-group-text bg-white border-end-0 text-muted small fw-bold" style="min-width: 100px; font-size: 0.8rem;">Mật khẩu</span>
                                <input type="password" name="password" id="password"
                                       class="form-control border-start-0 ps-0 shadow-none"
                                       placeholder="••••••••" required autofocus>
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="input-group input-group-lg password-group">
                                <span class="input-group-text bg-white border-end-0 text-muted small fw-bold" style="min-width: 100px; font-size: 0.8rem;">Xác nhận</span>
                                <input type="password" name="confirm" id="confirm"
                                       class="form-control border-start-0 ps-0 shadow-none"
                                       placeholder="••••••••" required>
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('confirm', this)"></i>
                            </div>
                            <small id="confirm-error" class="error-text text-danger mt-1 d-block"></small>
                        </div>

                        <div class="password-requirements mb-4">
                            <p class="req-title">Yêu cầu mật khẩu:</p>
                            <ul id="password-rules" class="rule-list">
                                <li id="rule-length">• Ít nhất 8 ký tự</li>
                                <li id="rule-upper">• Có chữ hoa (A-Z)</li>
                                <li id="rule-lower">• Có chữ thường (a-z)</li>
                                <li id="rule-special">• Có kí tự đặc biệt</li>
                                <li id="rule-number">• Có số (0-9)</li>
                            </ul>
                        </div>

                        <button type="submit" id="submit-btn" class="btn btn-black w-100 py-3 fw-bold shadow-sm">
                            ĐỔI MẬT KHẨU
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Layout cơ bản */
    .password-group {
        position: relative;
    }

    .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        z-index: 10;
        color: #6c757d;
        font-size: 1rem;
    }

    /* Style cho bảng yêu cầu */
    .password-requirements {
        padding: 15px;
        background-color: #f8f9fa;
        border-radius: 8px;
        border: 1px solid #eee;
    }

    .req-title {
        font-weight: bold;
        font-size: 13px;
        margin-bottom: 8px;
        color: #333;
    }

    .rule-list {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 13px;
    }

    .rule-list li {
        color: #6c757d;
        margin-bottom: 3px;
        transition: all 0.3s ease;
    }

    .rule-success {
        color: #28a745 !important;
        font-weight: bold;
    }

    /* Style nút và input của ông */
    .btn-black {
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        transition: all 0.3s ease;
        letter-spacing: 1px;
    }

    .btn-black:hover {
        background-color: #333333;
        transform: translateY(-1px);
    }

    .input-group-text {
        border-radius: 8px 0 0 8px !important;
    }

    .form-control {
        border-radius: 0 8px 8px 0 !important;
        padding-right: 45px !important; /* Chừa chỗ cho con mắt */
    }

    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
        border-color: #000000;
    }
</style>
{% endblock %}
