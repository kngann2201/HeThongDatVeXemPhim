{% extends "layout/base.html" %}
{% block title %}Thông tin của tôi{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 profile-sidebar">
                <div class="card-body text-center p-4">
                    <div class="mb-3">
                        <img src="{{ user.avatar or url_for('static', filename='images/default-avatar.png') }}"
                             class="rounded-circle shadow-sm"
                             width="130" height="130"
                             style="object-fit: cover; border: 3px solid #e74c3c;">
                    </div>
                    <h4 class="fw-bold mb-1">{{ user.username }}</h4>
                    <p class="text-muted small">Thành viên Cinema</p>
                    <a href="{{ url_for('logout_my_user') }}"
                       class="list-group-item list-group-item-action text-danger mt-2 border-top">
                        <i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0 profile-info-card h-100">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="mb-0 fw-bold text-dark">Hồ sơ cá nhân</h5>
                </div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6 text-start">
                            <label class="form-label fw-bold small text-uppercase">Họ và tên</label>
                            <input type="text" class="form-control bg-light"
                                   value="{{ user.full_name or 'Chưa cập nhật' }}" disabled>
                        </div>

                        <div class="col-md-6 text-start">
                            <label class="form-label fw-bold small text-uppercase">Email</label>
                            <input type="text" class="form-control bg-light" value="{{ user.email }}" disabled>
                        </div>

                        <div class="col-md-6 text-start">
                            <label class="form-label fw-bold small text-uppercase">Số điện thoại</label>
                            <input type="text" class="form-control bg-light"
                                   value="{{ user.phone_number or 'Chưa cập nhật' }}" disabled>
                        </div>
                        <div class="col-md-6 text-start">
                            <label class="form-label fw-bold small text-uppercase">Ngày sinh</label>
                            <input type="text" class="form-control bg-light"
                                   value="{{ user.birthday.strftime('%d/%m/%Y') if user.birthday else 'Chưa cập nhật' }}"
                                   disabled>
                        </div>
                    </div>

                    <div class="mt-5 pt-3 border-top d-flex gap-2">
                        <a href="/user/change_profile" class="btn btn-danger px-4">
                            <i class="fa-solid fa-pen me-1"></i> Chỉnh sửa
                        </a>
                        <a href="/user/change_password" class="btn btn-outline-dark px-4">
                            <i class="fa-solid fa-lock me-1"></i> Đổi mật khẩu
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
