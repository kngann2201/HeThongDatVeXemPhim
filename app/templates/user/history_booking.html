{% extends "layout/base.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="section-title">Lịch sử đặt vé của bạn</h2>
    <div class="table-responsive mt-4">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Mã vé</th>
                    <th>Phim</th>
                    <th>Suất chiếu</th>
                    <th>Ghế</th>
                    <th>Trạng thái</th>
                </tr>
            </thead>
            <tbody>
                {% for b in bookings %}
                <tr>
                    <td>#{{ b.id }}</td>
                    <td>{{ b.movie_name }}</td>
                    <td>{{ b.show_time }}</td>
                    <td>{{ b.seat_number }}</td>
                    <td><span class="badge bg-success">Thành công</span></td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">Bạn chưa có lịch sử đặt vé nào.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
