name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cinemadb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run:
        pip install -r requirements.txt

    - name: Run tests
      env:
        PYTHONPATH: .
        DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/cinemadb?charset=utf8mb4
      run: |
        python -c "from app import app, db; with app.app_context(): db.create_all()"
        python -m pytest app/
